trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

# 1. Prepare Sonar
- task: SonarCloudPrepare@X
  inputs:
    SonarCloud: 'sonar-service-connection'
    organization: 'your-org'
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: 'mcn-fin-tech'
    cliProjectName: 'mcn-fin-tech'

# 2. Install dependencies
- script: |
    pip install -r requirements.txt
  displayName: Install dependencies

# 3. Run tests + coverage
- script: |
    pytest --cov=. --cov-report=xml
  displayName: Unit tests

# 4. Run Sonar analysis
- task: SonarCloudAnalyze@X

# 5. Publish Quality Gate
- task: SonarCloudPublish@X
  inputs:
    pollingTimeoutSec: '300'