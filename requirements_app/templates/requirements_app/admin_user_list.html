{% extends 'requirements_app/base.html' %}{% block content %}<section class="page-heading"><p class="eyebrow">Admin</p><h1>Manage Users</h1></section><table><thead><tr><th>Username</th><th>Email</th><th>Staff</th><th>Superuser</th><th>Active</th><th>Action</th></tr></thead><tbody>{% for item in users %}<tr><td>{{ item.username }}</td><td>{{ item.email }}</td><td>{{ item.is_staff }}</td><td>{{ item.is_superuser }}</td><td>{{ item.is_active }}</td><td><a href="{% url 'admin_user_edit' item.id %}">Edit</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
