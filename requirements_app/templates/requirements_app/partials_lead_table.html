{% if leads %}<table><tr><th>Name</th><th>Service</th><th>Phone</th><th>Email</th><th>Status</th><th>Created</th></tr>{% for lead in leads %}<tr><td>{{ lead.name }}</td><td>{{ lead.service|default:"General" }}</td><td>{{ lead.phone }}</td><td>{{ lead.email }}</td><td><span class="status">{{ lead.get_status_display }}</span></td><td>{{ lead.created_at|date:"d M Y" }}</td></tr>{% endfor %}</table>{% else %}<p>No leads available.</p>{% endif %}
